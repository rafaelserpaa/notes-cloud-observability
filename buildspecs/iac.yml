version: 0.2

env:
  shell: bash
  variables:
    TERRAFORM_VERSION: "1.17.1"
    TERRAFORM_SHA256: "4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061"
    TFLINT_VERSION: "0.65.0"
    TFLINT_SHA256: "d4c545ed2e29d6338604b586f34f544f380f70f243aa72f7b484713835eaec61"
    TRIVY_VERSION: "0.76.1"
    TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
    TF_IN_AUTOMATION: "1"
    TF_INPUT: "0"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_IGNOREFILE: ".trivyignore.yaml"

phases:
  install:
    commands:
      - |
        set -eo pipefail
        curl -sSfL -o /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
        echo "${TERRAFORM_SHA256}  /tmp/terraform.zip" | sha256sum -c -
        unzip -o -q /tmp/terraform.zip terraform -d /usr/local/bin
        terraform version

        curl -sSfL -o /tmp/tflint.zip \
          "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
        echo "${TFLINT_SHA256}  /tmp/tflint.zip" | sha256sum -c -
        unzip -o -q /tmp/tflint.zip tflint -d /usr/local/bin
        tflint --version

        curl -sSfL -o /tmp/trivy.tar.gz \
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
        mkdir -p /opt/trivy && tar -xzf /tmp/trivy.tar.gz -C /opt/trivy
        ln -sf /opt/trivy/trivy /usr/local/bin/trivy
        trivy --version | head -1

  build:
    commands:
      - terraform fmt -check -recursive -diff
      - |
        set -eo pipefail
        for dir in . cicd; do
          echo ">> terraform validate: $dir"
          terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly -no-color >/dev/null
          terraform -chdir="$dir" validate -no-color
        done
      - tflint --recursive --config "$CODEBUILD_SRC_DIR/.tflint.hcl" --format compact
      - |
        set -eo pipefail
        mkdir -p reports
        trivy config . --skip-dirs '**/.terraform' --severity HIGH,CRITICAL --format table
        trivy config . --skip-dirs '**/.terraform' --severity HIGH,CRITICAL --exit-code 1 \
          --format template --template "@/opt/trivy/contrib/junit.tpl" --output reports/trivy-iac.xml

reports:
  trivy:
    base-directory: reports
    files:
      - trivy-iac.xml
    file-format: JUNITXML
