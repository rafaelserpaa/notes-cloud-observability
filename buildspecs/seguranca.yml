version: 0.2

env:
  shell: bash
  variables:
    GITLEAKS_VERSION: "8.30.1"
    GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - |
        set -eo pipefail
        curl -sSfL -o /tmp/gitleaks.tar.gz \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
        tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
        gitleaks version
      - python -m venv /opt/tools
      - /opt/tools/bin/pip install --quiet --disable-pip-version-check --require-hashes -r ci/requirements-tools.txt
      - /opt/tools/bin/pip-audit --version && /opt/tools/bin/bandit --version | head -1

  build:
    commands:
      - git config --global --add safe.directory "$CODEBUILD_SRC_DIR"
      - git fetch --unshallow --quiet || true
      - echo "Commits no histórico analisado:" "$(git rev-list --count HEAD)"
      - |
        REPROVADOS=""

        echo "==================== gitleaks: segredos em todo o histórico"
        gitleaks git . --redact --verbose || REPROVADOS="$REPROVADOS gitleaks"

        echo "==================== pip-audit: dependências (SCA)"
        /opt/tools/bin/pip-audit -r requirements.txt -r requirements-dev.txt --strict --desc on --progress-spinner off \
          || REPROVADOS="$REPROVADOS pip-audit"

        echo "==================== Bandit: código (SAST)"
        /opt/tools/bin/bandit -r . -x ./tests,./.terraform,./build -ll || REPROVADOS="$REPROVADOS bandit"

        if [ -n "$REPROVADOS" ]; then
          echo "PORTÕES REPROVADOS:$REPROVADOS"
          exit 1
        fi
        echo "Todos os portões de segurança aprovados."
